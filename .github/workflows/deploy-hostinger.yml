name: Deploy Lumina to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumina-hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lumina repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production application
        run: npm run build

      - name: Verify production output
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Inspect FTP account root to identify the real website directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          npm install --no-save basic-ftp
          node --input-type=module <<'NODE'
          import { Client } from 'basic-ftp';
          const client = new Client();
          client.ftp.verbose = false;
          try {
            await client.access({
              host: process.env.FTP_SERVER,
              user: process.env.FTP_USERNAME,
              password: process.env.FTP_PASSWORD,
              port: Number(process.env.FTP_PORT || 21),
              secure: false
            });
            console.log('FTP CURRENT DIRECTORY:', await client.pwd());
            const entries = await client.list();
            console.log('FTP ROOT CONTENTS:');
            for (const entry of entries) {
              console.log((entry.isDirectory ? '[DIR] ' : '[FILE] ') + entry.name);
            }
          } finally {
            client.close();
          }
          NODE

      - name: Stop before uploading until the FTP root is verified
        run: echo "Diagnostic only. No website files were changed in this run."
