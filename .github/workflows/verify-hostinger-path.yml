name: Verify actual domain folder
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-hostinger-path.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List actual website directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP
          f=FTP()
          f.connect(os.environ["FTP_SERVER"],int(os.environ["FTP_PORT"]),timeout=20)
          f.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          print("PWD",f.pwd())
          f.cwd("/")
          print("ROOT",f.nlst("."))
          f.cwd("/domains/lavdigitalagency.com")
          print("DOMAIN",f.pwd(),f.nlst("."))
          f.cwd("public_html")
          print("WEBROOT",f.pwd(),f.nlst("."))
          try:
              f.cwd("Lumina")
              print("WEBROOT/Lumina",f.pwd(),f.nlst("."))
          except Exception as e:
              print("WEBROOT/Lumina MISSING",repr(e))
          f.quit()
          PY
