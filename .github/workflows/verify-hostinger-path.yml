name: Verify Hostinger Lumina FTP location

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-hostinger-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect account and domain roots without changing files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP

          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], int(os.environ.get("FTP_PORT", "21")), timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          print("LOGIN PWD:", ftp.pwd())

          def inspect(path):
              print("\\nDIRECTORY:", repr(path), "FROM", ftp.pwd())
              try:
                  for entry in ftp.nlst(path):
                      print(" ", entry)
              except Exception as exc:
                  print("  [ERROR]", repr(exc))

          inspect(".")
          inspect("..")
          inspect("../domains")
          inspect("../domains/lavdigitalagency.com")
          inspect("../domains/lavdigitalagency.com/public_html")
          inspect("domains")
          inspect("domains/lavdigitalagency.com")
          inspect("domains/lavdigitalagency.com/public_html")
          inspect("Lumina")
          inspect("public_html/Lumina")

          for path in ["..", "../domains", "../domains/lavdigitalagency.com", "../domains/lavdigitalagency.com/public_html", "domains", "domains/lavdigitalagency.com", "domains/lavdigitalagency.com/public_html"]:
              try:
                  ftp.cwd(path)
                  print("\\nCWD SUCCESS:", path, "=>", ftp.pwd())
                  inspect(".")
              except Exception as exc:
                  print("\\nCWD FAILED:", path, repr(exc))

          ftp.quit()
          PY
